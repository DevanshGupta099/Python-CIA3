# ChristGrade "Verdigris & Obsidian" Architectural Theme
# Deep Obsidian / Warm Alabaster surfaces with Oceanic Teal, Seafoam Cyan & Champagne Amber accents.
# Tuned for 60fps smoothness, generous typography spacing, and WCAG AA >= 4.5:1 contrast.

[browser]
gatherUsageStats = false

[server]
enableStaticServing = true
enableWebsocketCompression = true
enableAgentApi = true

[runner]
fastReruns = true

[client]
showErrorLinks = false
toolbarMode = "minimal"

[theme]
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["26px", "19px", "16px", "15px", "14px", "12px"]
headingFontWeights = [700, 650, 600, 600, 500, 500]
metricValueFontSize = "1.8rem"
metricValueFontWeight = 700
baseRadius = "0.75rem"
buttonRadius = "0.58rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
paddingTop = "0.75rem"
paddingBottom = "2.5rem"

[theme.sidebar]
paddingTop = "1rem"
paddingBottom = "1.5rem"

[theme.light]
primaryColor = "#0F766E"
backgroundColor = "#F6F7F6"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#EDF1F0"
