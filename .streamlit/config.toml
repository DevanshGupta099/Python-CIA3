# ChristGrade "Solaris Editorial" Theme & High-Performance Runtime Config
# Royal Cobalt x Crimson Rose x Sunset Coral x Champagne Gold
# Tuned for 60fps rendering, WCAG AA >= 4.5:1 contrast, and zero telemetry overhead.

[browser]
gatherUsageStats = false

[server]
enableStaticServing = true
enableWebsocketCompression = true
enableAgentApi = true

[runner]
fastReruns = true

[client]
showErrorLinks = false

[theme]
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["26px", "19px", "16px", "15px", "14px", "12px"]
headingFontWeights = [750, 700, 650, 600, 500, 500]
metricValueFontSize = "1.82rem"
metricValueFontWeight = 750
baseRadius = "0.8rem"
buttonRadius = "0.62rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "2.5rem"

[theme.sidebar]
paddingTop = "1rem"
paddingBottom = "1.5rem"

[theme.light]
primaryColor = "#1D4ED8"
backgroundColor = "#F6F7FB"
