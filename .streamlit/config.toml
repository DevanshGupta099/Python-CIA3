# ChristGrade "Solaris Editorial" Theme
# Royal Cobalt x Crimson Rose x Sunset Coral x Champagne Gold
# Crisp elevated surfaces in both Light and Dark modes.

[theme]
font = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
headingFont = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["26px", "19px", "16px", "15px", "14px", "12px"]
headingFontWeights = [750, 650, 600, 600, 500, 500]
metricValueFontSize = "1.85rem"
metricValueFontWeight = 750
baseRadius = "0.8rem"
buttonRadius = "0.62rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "3rem"

[theme.sidebar]
paddingTop = "1rem"
paddingBottom = "1.5rem"

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#F6F7FB"
